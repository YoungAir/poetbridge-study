<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f5">
    <title>研究者数据工具 · PoetBridge</title>
    <link rel="stylesheet" href="styles.css">
    <script src="study-config.js"></script>
    <script src="researcher.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="返回参与者首页">
        <span class="brand-mark" aria-hidden="true">研</span>
        <span><strong>研究者数据工具</strong><small>PoetBridge · 匿名数据管理</small></span>
      </a>
      <a class="quiet-link" href="./">参与者页面</a>
    </header>
    <main class="page-shell">
      <div id="admin-banner" class="notice"></div>
      <section class="intro">
        <h1 class="screen-title">参与记录</h1>
        <p class="screen-subtitle">本页面只管理当前浏览器中的数据和你手动导入的答题文件。</p>
      </section>
      <section id="admin-content" aria-live="polite"></section>
    </main>
    <footer class="site-footer">
      <span>匿名数据管理</span>
      <span>导出后请按所在机构要求安全保存</span>
    </footer>
    <input id="import-files" type="file" accept="application/json,.json" multiple hidden>
  </body>
</html>
